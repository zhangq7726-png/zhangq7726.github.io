function update(dt){guard=Math.max(0,guard-dt);if(phase!=='playing'||paused){if(phase==='title')scroll+=dt*.25;return;}elapsed+=dt;distance+=speed()/3.6*dt;scroll+=dt*speed()/165;boost=Math.max(0,boost-dt);inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);charge=clamp(charge+dt*5,0,100);px+=(lane-px)*Math.min(1,dt*13);spawn-=dt;const v=.18+Math.min(.13,elapsed*.0015)+(boost>0?.1:0);
if(spawn<=0){spawn=Math.max(.78,1.5-elapsed*.007);let blocked=Math.floor(Math.random()*3)-1;objects.push({type:'car',lane:blocked,z:-.05,color:['#ff7189','#a493ef','#e9b97b'][Math.floor(Math.random()*3)]});if(elapsed>18&&Math.random()<.35)objects.push({type:'car',lane:blocked===1?-1:blocked+1,z:-.05,color:'#94adc8'});const safe=[-1,0,1].filter(l=>!objects.some(o=>o.type==='car'&&o.z<.02&&o.lane===l));if(safe.length){let cl=safe[Math.floor(Math.random()*safe.length)];for(let j=0;j<3;j++)objects.push({type:'coin',lane:cl,z:-.18-j*.09});}}
for(const o of objects){o.z+=dt*v;if(!o.hit&&o.z>.82&&o.z<.96&&Math.abs(o.lane-px)<.46){if(o.type==='coin'){o.hit=true;coins++;charge=clamp(charge+2,0,100);let p=proj(o.lane,.9);burst(p.x,p.y,gold);sound(980);}else if(inv<=0){o.hit=true;hearts--;inv=2;flash=.28;boost=0;burst(proj(px,.9).x,proj(px,.9).y,coral);sound(100,.3);if(hearts<=0){end(false);break;}}}}
objects=objects.filter(o=>o.z<1.18&&!o.hit);for(const p of sparks){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}sparks=sparks.filter(p=>p.life>0);if(R.duration>0&&elapsed>=R.duration&&phase==='playing')end(true);}
function draw(){scenery();for(const o of [...objects].sort((a,b)=>a.z-b.z)){if(o.z<0)continue;let p=proj(o.lane,o.z);if(o.type==='car')car(p.x,p.y,p.s,o.color,false);else coin(p.x,p.y,p.s);}if(phase==='playing'&&!(inv>0&&Math.floor(inv*12)%2)){let p=proj(px,.9);car(p.x,p.y,p.s,cyan,true);}for(const p of sparks){c.globalAlpha=clamp(p.life/.65,0,1);c.fillStyle=p.color;c.fillRect(p.x,p.y,5,8);}c.globalAlpha=1;if(flash>0){c.fillStyle='#ff536c55';c.fillRect(0,0,720,1280);}hud();overlay();}
function frame(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;fps=fps*.95+(1/dt)*.05;update(dt);draw();requestAnimationFrame(frame);}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='m'){muted=!muted;return;}if(e.key.toLowerCase()==='p'||e.key==='Escape'){if(phase==='playing')paused=!paused;return;}if(phase!=='playing'){if((e.key==='Enter'||e.key===' ')&&guard<=0)start();return;}if(e.key==='Enter'&&paused){paused=false;return;}if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' ')nitro();});
let down=null;function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*1280/r.height};}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus();let p=point(e);down={...p,handled:false};canvas.setPointerCapture(e.pointerId);if(p.y<85&&p.x>550){if(p.x<615)muted=!muted;else if(phase==='playing')paused=!paused;down.handled=true;return;}if(phase!=='playing'){if(guard<=0)start();down.handled=true;return;}if(paused){paused=false;down.handled=true;return;}if(p.y>1105){if(p.x>=432)nitro();else if(p.x>=313)move(1);else if(p.x>=207)move(-1);down.handled=true;}});
canvas.addEventListener('pointerup',e=>{if(!down)return;let p=point(e);if(!down.handled&&phase==='playing'&&!paused){if(Math.abs(p.x-down.x)>35)move(p.x>down.x?1:-1);else if(p.y<1105)move(p.x<360?-1:1);}down=null;});canvas.addEventListener('pointercancel',()=>{down=null;});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing')paused=true;});
window.__gameState=()=>({phase,score:Math.floor(distance)+coins*50,hearts,time:R.duration>0?Math.max(0,R.duration-elapsed):elapsed,fps:Math.round(fps),heroOnScreen:true,hero:{x:proj(px,.9).x,y:proj(px,.9).y},world:{w:720,h:1280},distance:Math.floor(distance),coins,lane,paused,charge:Math.round(charge),boost,speed:Math.round(speed()),enemies:objects.filter(o=>o.type==='car').map(o=>({...o,...proj(o.lane,o.z)})),pickups:objects.filter(o=>o.type==='coin').map(o=>({...o,...proj(o.lane,o.z)}))});

window.__autoplay=()=>{if(phase!=='playing'||paused)return;const risk=l=>objects.filter(o=>o.type==='car'&&o.lane===l&&o.z>.42&&o.z<1.06).reduce((n,o)=>n+Math.max(0,1-Math.abs(.9-o.z))*100,0);let choices=[-1,0,1].filter(l=>Math.abs(l-lane)<=1).sort((a,b)=>(risk(a)+Math.abs(a-lane)*8)-(risk(b)+Math.abs(b-lane)*8));let target=choices[0];if(risk(lane)>0&&target!==lane)move(Math.sign(target-lane));if(charge>80&&objects.every(o=>o.type!=='car'||o.lane!==lane||o.z<.3))nitro();};
